<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smarti Environmental CRM{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Header with Strict Single-Line Alignment -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <a href="/" class="flex items-center space-x-2.5 flex-shrink-0">
                <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
                    <i class="fa-solid fa-droplet text-xs"></i>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="font-extrabold text-slate-900 tracking-tight text-base whitespace-nowrap">Smarti<span class="text-emerald-600 font-semibold">Environmental</span></span>
                    <span class="hidden sm:inline-flex bg-emerald-50 text-emerald-800 border border-emerald-200 text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">CRM & Dispatch</span>
                </div>
            </a>

            <!-- Navigation Links (Single Line, No Multi-Line Wrapping) -->
            <nav class="hidden md:flex items-center space-x-1.5 flex-shrink-0">
                <a href="/" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg whitespace-nowrap transition-colors {% if active_page == 'dashboard' %}bg-emerald-50 text-emerald-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    <i class="fa-solid fa-chart-pie mr-1.5 text-xs"></i> Dashboard
                </a>
                <a href="/customers" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg whitespace-nowrap transition-colors {% if active_page == 'customers' %}bg-emerald-50 text-emerald-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    <i class="fa-solid fa-users mr-1.5 text-xs"></i> Customers
                </a>
                <a href="/jobs?view=upcoming" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg whitespace-nowrap transition-colors {% if active_page == 'jobs' %}bg-emerald-50 text-emerald-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    <i class="fa-solid fa-calendar-check mr-1.5 text-xs"></i> Appointments
                </a>
                <a href="/staff" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg whitespace-nowrap transition-colors {% if active_page == 'staff' %}bg-emerald-50 text-emerald-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    <i class="fa-solid fa-screwdriver-wrench mr-1.5 text-xs"></i> Field Team
                </a>
            </nav>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2 flex-shrink-0">
                <a href="/jobs/new" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm transition whitespace-nowrap">
                    <i class="fa-solid fa-plus mr-1.5 text-xs"></i> Book Appointment
                </a>
                <a href="/customers/new" class="h-9 inline-flex items-center px-3 text-xs font-semibold rounded-lg text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 transition whitespace-nowrap">
                    <i class="fa-solid fa-user-plus mr-1.5 text-slate-500 text-xs"></i> New Customer
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content Area with Clean Vertical Spacing -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
            <div>
                <strong>Smarti Environmental Limited</strong> &bull; Commercial Water Efficiency CRM & Field Operations
            </div>
            <div class="mt-2 sm:mt-0 flex items-center space-x-4">
                <span>Local SQLite Database</span>
                <span class="text-slate-300">|</span>
                <a href="/docs" target="_blank" class="text-emerald-600 hover:underline"><i class="fa-solid fa-code text-[10px] mr-1"></i>FastAPI Docs</a>
            </div>
        </div>
    </footer>

</body>
</html>
